<section class="max-w-screen md:max-w-2xl mx-auto px-4 py-4">
    <div>
        <div class="flex flex-row items-start justify-between">
            <nav hlmBreadcrumb class="mb-4 pl-2">
                <ol hlmBreadcrumbList>
                    <li hlmBreadcrumbItem>
                        <a hlmBreadcrumbLink link="/inicio">Inicio</a>
                    </li>
                    <li hlmBreadcrumbSeparator></li>
                    <li hlmBreadcrumbItem>
                        <span hlmBreadcrumbPage>Mis Finanzas</span>
                    </li>
                </ol>
            </nav>
            <button hlmBtn variant="link" type="button" class="text-sm z-10 p-0! m-0! -mt-2!" (click)="ayudaClick()">¿Necesitas ayuda?</button>
        </div>
        <h4 hlmH4 class="text-center">
            {{ negocioStore.negocioSeleccionado()?.nombre }}
        </h4>
        <div class="flex justify-center-safe items-center gap-3 pt-1 pb-5 fade-in">
            <ng-icon hlm name="lucideWallet" />
            <h3 hlmH3>Mis Finanzas</h3>
        </div>
    </div>
    <div class="w-full overflow-x-auto scrollContainerHorizontal pb-2">
        <app-cuentas-financieras [ayudaRunning]="ayudaRunning()" (selectionChanged)="cuentaFinancieraCambiada($event)"></app-cuentas-financieras>
    </div>
    @if (idCuentaFinancieraSeleccionada()) {
        <div class="w-full py-2">
            <app-movimientos-financieros
                [ayudaRunning]="ayudaRunning()"
                [idCuentaFinanciera]="idCuentaFinancieraSeleccionada()!"
                (notificarCambio)="movimientoActualizado()"
            ></app-movimientos-financieros>
        </div>
    }
</section>
